version: "3.9"

services:

  # -------------------------------------------------------------------------
  # Official Telegram Local Bot API Server
  # Lifts the 20 MB file download cap to 2 GB.
  # Docs: https://github.com/tdlib/telegram-bot-api
  # -------------------------------------------------------------------------
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1           # run in local mode (no ip check)
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"               # expose only on localhost if you prefer
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Kajian bot
  # -------------------------------------------------------------------------
  kajian-bot:
    build: .
    env_file: .env
    environment:
      # Point at the sibling service by its compose service name
      LOCAL_API_URL: http://telegram-bot-api:8081
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

volumes:
  telegram-bot-api-data:
