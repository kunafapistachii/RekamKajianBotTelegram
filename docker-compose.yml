version: "3.9"

services:

  # -------------------------------------------------------------------------
  # Official Telegram Local Bot API Server
  # Lifts the 20 MB file download cap to 2 GB.
  # Docs: https://github.com/tdlib/telegram-bot-api
  # -------------------------------------------------------------------------
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1           # run in local mode (no ip check)
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"               # expose only on localhost if you prefer
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Kajian bot
  # -------------------------------------------------------------------------
  kajian-bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      LOCAL_API_URL: ${LOCAL_API_URL:-http://telegram-bot-api:8081}
      WP_SITE_URL: ${WP_SITE_URL}
      WP_USER: ${WP_USER}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD}
      WP_POST_STATUS: ${WP_POST_STATUS:-publish}
      AUDIO_CODEC: ${AUDIO_CODEC:-libopus}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-48k}
      AUDIO_CHANNELS: ${AUDIO_CHANNELS:-1}
      OUTPUT_EXT: ${OUTPUT_EXT:-opus}
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

volumes:
  telegram-bot-api-data:
